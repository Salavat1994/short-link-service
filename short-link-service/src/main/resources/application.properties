# Время жизни ссылки задает система; 86400 = 24 часа.
link.ttl.seconds=86400
# Лимит по умолчанию и максимально допустимый лимит.
link.clicks.default=5
link.clicks.max=1000
# Период автоматической очистки просроченных ссылок.
link.cleanup.seconds=5
# Локальный префикс для консольных ссылок (НЕ реальный веб-домен).
link.prefix=short.local/
# Сохранение ссылок, UUID и уведомлений между запусками.
link.storage.path=data/shortlinks.properties
